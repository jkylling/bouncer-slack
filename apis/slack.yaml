---
# Slack Web API — https://docs.slack.dev/reference/methods
#
# The Web API lives at a flat namespace: every method is callable as
# /api/<method.name> (e.g. /api/chat.postMessage). There are no
# path-captured IDs — channel, user, ts, etc. ride in the request body.
# This spec declares each covered method as a POST action and threads
# the body fields through the bind/binds expressions to construct
# `conversation`, `user`, and `bot` metas. The optional `?key:` form
# is used so a missing body field (legacy form-encoded request, or a
# call that doesn't carry the field) collapses the constructor into a
# no-op rather than fetching with an empty id.
#
# Resources covered:
#   conversation    (conversations.info)     — channels, DMs, MPIMs, private groups
#   user            (users.info)             — workspace member
#   bot             (bots.info)              — bot user identity
#   file            (files.info)             — uploaded file
#   team            (team.info)              — workspace scope (per-token, sentinel-keyed)
#   identity        (auth.test)              — token identity scope (per-token, sentinel-keyed)
#
# `team` and `identity` are per-token scope metas. The natural key is
# the token itself (one workspace + one identity per token), so they
# carry a single `scope` input fixed to "self" by every binding action.
# That keeps the schema on documented ground (the input list is
# non-empty) while preserving the "one fetch per request" cost shape.
#
# Action coverage focuses on the practical core: conversations.*,
# chat.*, users.*, team.*, reactions.*, pins.*, bookmarks.*, files.*,
# views.*, bots.*, emoji.*, auth.*. Lesser-used surfaces (admin.*,
# enterprise.*, calls.*, dnd.*, rtm.*, stars.*, oauth.*, …) are
# intentionally not declared in this v0.1 cut; the proxy will return
# 404 for them. Add them in a follow-up bundle as needed.
#
# Not yet metas (no clean single-id GET): `message` (closest is
# conversations.history?latest=ts&inclusive=true&limit=1), `usergroup`
# (only usergroups.list, which fails cost discipline), `view`,
# `scheduled_message`. Add later if a real gating use case shows up.
#
# == Conventions ========================================================
#
# - Read methods are declared as POST, matching the modern Slack-SDK
#   pattern. Operators wanting to gate legacy GET clients should add
#   parallel actions with `method: GET`.
# - All meta output fields use Slack's wire field names so policies
#   can read them directly (e.g. `conversation.is_private`,
#   `user.profile.email`).

name: slack
base_url: "https://slack.com"
path_prefixes:
- /api

# Slack's Web API returns 200 with `{"ok": false, "error": "..."}` for
# every application-level error (auth, permission, validation), and
# every official Slack SDK branches on body.ok before looking at the
# HTTP status. A 401/403 from the proxy makes the SDK throw a
# transport-level error before it ever inspects the body, so denials
# on routes claimed by this API surface as 200 to keep the SDK happy
# (the body still carries `ok: false` + a message).
access_denied_status: 200

meta:
- name: conversation
  kind: endpoint
  input:
  - name: channel_id
  request: 'post_form("/api/conversations.info", {"channel": input.channel_id})'
  output:
  - name: id
    expr: response.body.?channel.?id
  - name: name
    expr: response.body.?channel.?name
  - name: is_channel
    expr: response.body.?channel.?is_channel
  - name: is_group
    expr: response.body.?channel.?is_group
  - name: is_im
    expr: response.body.?channel.?is_im
  - name: is_mpim
    expr: response.body.?channel.?is_mpim
  - name: is_private
    expr: response.body.?channel.?is_private
  - name: is_archived
    expr: response.body.?channel.?is_archived
  - name: is_general
    expr: response.body.?channel.?is_general
  - name: is_shared
    expr: response.body.?channel.?is_shared
  - name: is_ext_shared
    expr: response.body.?channel.?is_ext_shared
  - name: is_org_shared
    expr: response.body.?channel.?is_org_shared
  - name: created
    expr: response.body.?channel.?created
  - name: creator
    expr: response.body.?channel.?creator
  - name: num_members
    expr: response.body.?channel.?num_members
  - name: topic
    expr: response.body.?channel.?topic
  - name: purpose
    expr: response.body.?channel.?purpose
  # Cross-ref: the channel's creator as a `user`. `?user_id:` makes the
  # constructor a no-op when `creator` is absent (some channel kinds
  # don't expose it).
  - name: creator_user
    expr: 'user{?user_id: response.body.?channel.?creator}'

- name: user
  kind: endpoint
  input:
  - name: user_id
  request: 'post_form("/api/users.info", {"user": input.user_id})'
  output:
  - name: id
    expr: response.body.?user.?id
  - name: team_id
    expr: response.body.?user.?team_id
  - name: name
    expr: response.body.?user.?name
  - name: real_name
    expr: response.body.?user.?real_name
  - name: deleted
    expr: response.body.?user.?deleted
  - name: is_admin
    expr: response.body.?user.?is_admin
  - name: is_owner
    expr: response.body.?user.?is_owner
  - name: is_primary_owner
    expr: response.body.?user.?is_primary_owner
  - name: is_restricted
    expr: response.body.?user.?is_restricted
  - name: is_ultra_restricted
    expr: response.body.?user.?is_ultra_restricted
  - name: is_bot
    expr: response.body.?user.?is_bot
  - name: is_app_user
    expr: response.body.?user.?is_app_user
  - name: tz
    expr: response.body.?user.?tz
  - name: profile
    expr: response.body.?user.?profile
  - name: email
    expr: response.body.?user.?profile.?email

- name: bot
  kind: endpoint
  input:
  - name: bot_id
  request: 'post_form("/api/bots.info", {"bot": input.bot_id})'
  output:
  - name: id
    expr: response.body.?bot.?id
  - name: name
    expr: response.body.?bot.?name
  - name: app_id
    expr: response.body.?bot.?app_id
  - name: deleted
    expr: response.body.?bot.?deleted
  - name: user_id
    expr: response.body.?bot.?user_id
  # Cross-ref: the workspace user this bot is registered against.
  - name: user
    expr: 'user{?user_id: response.body.?bot.?user_id}'

- name: file
  kind: endpoint
  input:
  - name: file_id
  request: 'post_form("/api/files.info", {"file": input.file_id})'
  output:
  - name: id
    expr: response.body.?file.?id
  - name: name
    expr: response.body.?file.?name
  - name: title
    expr: response.body.?file.?title
  - name: mimetype
    expr: response.body.?file.?mimetype
  - name: filetype
    expr: response.body.?file.?filetype
  - name: size
    expr: response.body.?file.?size
  - name: user
    expr: response.body.?file.?user
  - name: created
    expr: response.body.?file.?created
  - name: is_external
    expr: response.body.?file.?is_external
  - name: is_public
    expr: response.body.?file.?is_public
  - name: public_url_shared
    expr: response.body.?file.?public_url_shared
  - name: url_private
    expr: response.body.?file.?url_private
  - name: permalink
    expr: response.body.?file.?permalink
  - name: channels
    expr: response.body.?file.?channels
  - name: groups
    expr: response.body.?file.?groups
  - name: ims
    expr: response.body.?file.?ims
  # Cross-ref: the uploader as a `user`.
  - name: uploader
    expr: 'user{?user_id: response.body.?file.?user}'

# Per-token workspace scope. team.info returns the workspace metadata.
# Sentinel-keyed by `scope` (always "self") so all bindings collapse
# to one fetch per request.
- name: team
  kind: endpoint
  input:
  - name: scope
  request: 'post_form("/api/team.info", {})'
  output:
  - name: id
    expr: response.body.?team.?id
  - name: name
    expr: response.body.?team.?name
  - name: domain
    expr: response.body.?team.?domain
  - name: email_domain
    expr: response.body.?team.?email_domain
  - name: enterprise_id
    expr: response.body.?team.?enterprise_id
  - name: enterprise_name
    expr: response.body.?team.?enterprise_name
  - name: icon
    expr: response.body.?team.?icon

# Per-token identity. auth.test reflects who the OAuth token is bound
# to (workspace + user/bot). Sentinel-keyed; one fetch per request.
- name: identity
  kind: endpoint
  input:
  - name: scope
  request: 'post_form("/api/auth.test", {})'
  output:
  - name: url
    expr: response.body.?url
  - name: team
    expr: response.body.?team
  - name: team_id
    expr: response.body.?team_id
  - name: user
    expr: response.body.?user
  - name: user_id
    expr: response.body.?user_id
  - name: bot_id
    expr: response.body.?bot_id
  - name: enterprise_id
    expr: response.body.?enterprise_id
  - name: is_enterprise_install
    expr: response.body.?is_enterprise_install
  # Cross-ref: the calling user, when this is a user token.
  - name: caller
    expr: 'user{?user_id: response.body.?user_id}'
  # Cross-ref: the bot identity, when this is a bot token. `?bot_id:`
  # makes the constructor a no-op for user tokens.
  - name: caller_bot
    expr: 'bot{?bot_id: response.body.?bot_id}'

actions:
# ---- auth ------------------------------------------------------------
# auth.test — verify the token. No target.
- name: test_auth
  method: POST
  path: /api/auth.test
  binds:
    - |
      team{scope: "self"}
    - |
      identity{scope: "self"}

# auth.revoke — invalidate the token. Effectively destructive; gate it.
- name: revoke_auth
  method: POST
  path: /api/auth.revoke
  binds:
    - |
      team{scope: "self"}
    - |
      identity{scope: "self"}

# ---- conversations ---------------------------------------------------
# conversations.list — paginated channel directory. No target.
- name: list_conversations
  method: POST
  path: /api/conversations.list
  binds:
    - |
      team{scope: "self"}
    - |
      identity{scope: "self"}

# conversations.info — single-channel read.
- name: get_conversation
  method: POST
  path: /api/conversations.info
  binds:
    - |
      conversation{?channel_id: request.body.?channel}
    - |
      team{scope: "self"}
    - |
      identity{scope: "self"}

# conversations.history — message history within a channel.
- name: get_conversation_history
