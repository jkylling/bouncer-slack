# conversations.mark — set a channel's read cursor.
- name: mark_conversation
  method: POST
  path: /api/conversations.mark
  binds:
    - |
      conversation{?channel_id: request.body.?channel}
    - |
      team{scope: "self"}
    - |
      identity{scope: "self"}

