  path: /api/conversations.close
  binds:
    - |
      conversation{?channel_id: request.body.?channel}
    - |
      team{scope: "self"}
    - |
      identity{scope: "self"}

# conversations.create — create a new public or private channel.
- name: create_conversation
  method: POST
  path: /api/conversations.create
  binds:
    - |
      team{scope: "self"}
    - |
      identity{scope: "self"}

# conversations.archive — archive a channel.
- name: archive_conversation
