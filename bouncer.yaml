schema_version: 1
name: bouncer-slack
version: 0.1.0
description: |
  Bouncer API specs for Slack — the Slack Web API at slack.com/api.
  Install with `bouncer apis add github.com/jkylling/bouncer-slack@<ref>`
  and the proxy will load every YAML under apis/ automatically.
apis:
  - apis/

# Service block (slug + MCP-staging metadata).
service:
  slug: slack
  title: Slack
  description: |
    Slack Web API. Bouncer holds the upstream bot or user token;
    agents only see a bouncer-issued bearer.
  prompt: prompts/slack-token.md
  credential:
    path: ~/.config/bouncer/slack-token
    mode: "0600"
    template: "{{ .AccessToken }}"
  env:
    SLACK_TOKEN:     "{{ .AccessToken }}"
    SLACK_API_TOKEN: "{{ .AccessToken }}"

# Bring-your-own-token variants. Slack has two practical shapes:
# a regular bot / user token, and (advanced) the browser cookies
# extracted from an existing Slack session.
token:
  - id: bot_or_user_token
    title: Bot or user token
    description: |
      Paste a `xoxb-…` bot token or `xoxp-…` user token issued from
      a Slack app. Standard path for production agents.
    fields:
      - name: access_token
        label: Token
        kind: secret
        placeholder: xoxb-...
        required: true

  - id: browser_cookies
    title: Browser cookies (advanced)
    description: |
      Paste the `d` cookie value from an existing Slack browser
      session, plus your workspace's xoxc token. Useful for
      interacting with Slack APIs that don't accept regular bot
      tokens. Re-paste when the session expires.
    fields:
      - name: access_token
        label: xoxc token
        kind: secret
        placeholder: xoxc-...
        required: true
      - name: cookie_d
        label: 'Cookie "d" value'
        kind: secret
        help: 'The full value of the "d" cookie from your browser.'
        required: true

# Suggested starter policies. Hand-edited; identifiers are hard-
# coded so most should work out of the box.
policies:
  - id: slack-channels-read-only
    title: Slack — channels read-only
    description: |
      Permit conversations.info, conversations.history,
      conversations.list, and users.info. No posts, no DMs, no
      reactions.
    file: policies/channels-read-only.yaml
    default_enabled: true

  - id: slack-no-dm
    title: Slack — block direct messages
    description: |
      Deny conversations.* on any channel whose meta reports it as
      a 1:1 DM. Pair with the channels-read-only policy for a
      paranoid digest agent.
    file: policies/no-dm.yaml
    default_enabled: false
