schema_version: 1
name: bouncer-slack
version: 0.1.0
description: |
  Bouncer API specs for Slack — the Slack Web API at slack.com/api.
  Install with `bouncer apis add github.com/jkylling/bouncer-slack@<ref>`
  and the proxy will load every YAML under apis/ automatically.
apis:
  - apis/

service:
  slug: slack
  title: Slack
  description: |
    Slack Web API. Issues bouncer-bearer JWTs that wrap your upstream
    bot/user token (or browser-session cookies).

# Bring-your-own-token variants. The tokens screen renders one form
# per variant and emits a copy-pasteable bouncer JWT.
token:
  - id: bot_or_user_token
    title: Bot or user token
    description: |
      Paste a `xoxb-…` bot token or `xoxp-…` user token issued from
      a Slack app. Standard path for production agents.
    fields:
      - name: access_token
        label: Token
        kind: secret
        placeholder: xoxb-...
        required: true

  - id: browser_cookies
    title: Browser cookies (advanced)
    description: |
      Paste the workspace's xoxc token plus the `d` cookie value from
      an existing Slack browser session. Useful for interacting with
      Slack APIs that don't accept regular bot tokens. Re-paste when
      the session expires.
    fields:
      - name: access_token
        label: xoxc token
        kind: secret
        placeholder: xoxc-...
        required: true
      - name: cookie_d
        label: 'Cookie "d" value'
        kind: secret
        help: 'The full value of the "d" cookie from your browser.'
        required: true
        header: Cookie
        template: "d={{.}}"
